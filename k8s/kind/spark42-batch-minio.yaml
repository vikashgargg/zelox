# Spark 4.2.0 batch-on-MinIO baseline (kind) — runs the SAME scripts/batch_s3_bench.py as Zelox
# (generate -> write Parquet to S3 -> read back + aggregate), local[*], on MinIO (S3 API). Fair like-for-like
# vs Zelox on the same bucket (run sequentially, Zelox scaled to 0 first). Spark 4.2 needs Java 17 (installed)
# + hadoop-aws matching the bundled Hadoop 3.5.0. MinIO creds via SimpleAWSCredentialsProvider + path-style.
# Requires ConfigMap 'batch-s3-script' (= scripts/batch_s3_bench.py) + env S3_PATH/N_ROWS at run time.
apiVersion: batch/v1
kind: Job
metadata: { name: spark-batch-s3, namespace: stream }
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: spark
          image: python:3.12-slim-bookworm
          resources:
            requests: { cpu: "1", memory: "2Gi" }
            limits: { cpu: "2", memory: "3Gi" }
          env:
            - { name: BENCH_REMOTE, value: "local[2]" }   # classic local master (not Connect) — scaled for kind
            - { name: ENGINE, value: "spark" }
            - { name: S3_PATH, value: "__S3_PATH__" }
            - { name: N_ROWS, value: "__N_ROWS__" }
            - { name: SPARK_LOCAL_IP, value: "127.0.0.1" }
            - { name: AWS_REGION, value: "us-east-1" }
            - { name: MINIO_EP, value: "http://minio.stream.svc.cluster.local:9000" }
            - name: PYSPARK_SUBMIT_ARGS
              value: >-
                --packages org.apache.hadoop:hadoop-aws:3.5.0
                --conf spark.hadoop.fs.s3a.endpoint=http://minio.stream.svc.cluster.local:9000
                --conf spark.hadoop.fs.s3a.access.key=minioadmin
                --conf spark.hadoop.fs.s3a.secret.key=minioadmin
                --conf spark.hadoop.fs.s3a.path.style.access=true
                --conf spark.hadoop.fs.s3a.connection.ssl.enabled=false
                --conf spark.hadoop.fs.s3a.aws.credentials.provider=org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
                --conf spark.hadoop.fs.s3.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
                --driver-memory 1500m --conf spark.sql.shuffle.partitions=8 pyspark-shell
          volumeMounts: [ { name: script, mountPath: /app } ]
          command:
            - /bin/sh
            - -c
            - |
              set -e
              apt-get update -qq && apt-get install -y -qq openjdk-17-jre-headless procps >/dev/null
              pip install --quiet "setuptools<81" "pyspark==4.2.0" pandas pyarrow
              echo "=== Spark 4.2.0 batch-on-MinIO (local[2]) -> $S3_PATH ==="
              S3_PATH="$(echo "$S3_PATH" | sed 's|^s3://|s3a://|')" python3 /app/batch_s3_bench.py
              cat /sys/fs/cgroup/memory.peak 2>/dev/null | awk '{printf "SPARK_PEAK_RSS_GiB=%.2f\n",$1/1073741824}'
      volumes:
        - name: script
          configMap: { name: batch-s3-script }
